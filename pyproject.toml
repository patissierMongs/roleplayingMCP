[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roleplaying-dice-mcp"
version = "5.0.0"
description = "MCP server that gives AI agents fair dice — standard notation, dice pools, and a verifiable roll history; game-system rules stay with the agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
roleplaying-dice-mcp = "roleplaying_dice_mcp:main"
